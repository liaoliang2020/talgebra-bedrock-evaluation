name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Scan repository content
        run: python tools/check_public_tree.py

  numerical-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3

      - name: Run deterministic smoke tests
        uses: matlab-actions/run-command@v3
        with:
          command: run("tests/run_smoke_tests.m")
