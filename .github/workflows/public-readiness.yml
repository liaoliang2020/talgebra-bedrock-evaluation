name: Public readiness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the pinned runtime dependency range
        run: python -m pip install --disable-pip-version-check -r aws_bedrock_demo/requirements.txt

      - name: Compile the Bedrock example
        run: python -m py_compile aws_bedrock_demo/invoke_fable5.py tools/check_public_tree.py

      - name: Run the credential-free dry run
        run: python aws_bedrock_demo/invoke_fable5.py --dry-run

      - name: Test the Bedrock response handling
        run: python -m unittest discover -s tests_python -v

      - name: Check the public tree
        run: python tools/check_public_tree.py
